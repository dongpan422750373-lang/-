<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>背书</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="背书">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17323F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1518" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --ink:#17323F; --ink-soft:#2E4A55; --paper:#EEF1F3; --card:#fff;
  --line:#DBE2E6; --mute:#6B7C84; --gold:#C98A17; --gold-bg:#FBF1DC;
  --gold-ink:#7A5406; --ochre:#8C4A3C; --pine:#3E6B5A;
  --nav:rgba(255,255,255,.94); --on-ink:#fff; --on-ink-muted:rgba(255,255,255,.72); --subtle:#F5F7F8;
  --progress:#DCE3E7; --danger-line:#E5CFC9; --log-empty:#E4EAEE;
  --miss:#D9B4AC; --toast-bg:rgba(23,50,63,.94); --toast-ink:#fff;
  --base:17px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#EDF5F7; --ink-soft:#C1D0D5; --paper:#0E1518; --card:#182227;
    --line:#304047; --mute:#97A8AF; --gold:#E5AD43; --gold-bg:#332A19;
    --gold-ink:#F4C86A; --ochre:#E69A88; --pine:#76B79B;
    --nav:rgba(17,25,29,.94); --on-ink:#102027; --on-ink-muted:rgba(16,32,39,.68); --subtle:#202C31;
    --progress:#2B393F; --danger-line:#66463F; --log-empty:#27353A;
    --miss:#8A5E58; --toast-bg:rgba(238,245,247,.95); --toast-ink:#102027;
  }
  html{color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;min-height:100dvh}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  font-size:var(--base); line-height:1.7; color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
.num{font-family:"DIN Alternate","Helvetica Neue",sans-serif;font-weight:600;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}

#app{max-width:640px;min-height:100vh;min-height:100dvh;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 96px}
.hidden{display:none !important}

/* ---- tabs ---- */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--nav);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)
}
#tabs button{flex:1;padding:11px 0 9px;font-size:.72rem;color:var(--mute);line-height:1.3}
#tabs button .ic{display:block;font-size:1.05rem;margin-bottom:1px}
#tabs button.on{color:var(--ink);font-weight:600}

/* ---- shared ---- */
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px}
.eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--mute);display:block}
.muted{color:var(--mute);font-size:.85rem}
.btn{display:block;width:100%;padding:16px;border-radius:12px;background:var(--ink);
  color:var(--on-ink);font-size:1.05rem;font-weight:600;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--ochre);border:1.5px solid var(--danger-line)}
.btn+.btn{margin-top:10px}
.chip{display:inline-block;padding:6px 14px;margin:0 8px 8px 0;border-radius:999px;
  background:var(--paper);font-size:.85rem;color:var(--ink-soft);border:1.5px solid transparent}
.chip.on{background:var(--ink);color:var(--on-ink)}
.row{display:flex;align-items:center;margin-top:11px;gap:10px}
.row .nm{width:110px;font-size:.85rem;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{flex:1;height:7px;background:var(--paper);border-radius:999px;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--ink-soft)}
.row .bar i.o{background:var(--ochre)}
.row .n{width:34px;text-align:right;font-size:.85rem;color:var(--mute)}

/* ---- today ---- */
.hero{padding:22px 4px 6px}
.hero .big{font-size:4.4rem;line-height:1}
.hero .unit{font-size:1.05rem;margin-left:8px;color:var(--ink-soft)}
.pbar{height:6px;background:var(--progress);border-radius:999px;overflow:hidden;margin:6px 4px 6px}
.pbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.duo{display:flex;gap:10px;margin-top:4px}
.duo button{flex:1;padding:15px 0;background:var(--card);border-radius:12px;font-size:.95rem;color:var(--ink-soft)}

/* ---- 首页倒计时 ---- */
.countcard{width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  background:var(--card);border-radius:14px;padding:16px 17px;margin-bottom:14px}
.countcard .cdmain{display:block;flex:1;min-width:0}
.countcard .cdline{display:block;font-size:1.02rem;margin-top:3px;line-height:1.55}
.countcard .cdline .days{font-size:2rem;line-height:1;color:var(--gold);margin:0 3px}
.countcard .cddate{display:block;color:var(--mute);font-size:.76rem;margin-top:3px}
.countcard .cdedit{color:var(--mute);font-size:.82rem;flex-shrink:0}
.countcard.empty .cdline{color:var(--ink-soft)}
.countedit .editacts{display:flex;gap:9px;margin-top:14px}
.countedit .editacts button{flex:1;padding:11px 8px;border-radius:9px;background:var(--paper)}
.countedit .editacts .save{background:var(--ink);color:var(--on-ink);font-weight:600}
.countedit .editacts .clear{color:var(--ochre)}

/* ---- review ---- */
#review{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#review .inner{max-width:640px;margin:0 auto}
.rtop{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--mute)}
.rtop .pos{color:var(--ink);font-size:.95rem}
.rtop .crumb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtop button{color:var(--mute);font-size:.85rem;padding:4px 6px}
.rprog{height:4px;background:var(--progress);border-radius:999px;overflow:hidden;margin:9px 0 16px}
.rprog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.stage{background:var(--card);border-radius:16px;padding:24px 20px;min-height:230px;margin-bottom:16px}
.stage img{width:100%;border-radius:9px;margin-bottom:16px;display:block}
.qtext{font-size:1.2rem;line-height:2}

/* 墨块：签名交互 */
.ink{background:var(--ink);color:transparent;border-radius:3px;padding:0 4px;
  cursor:pointer;transition:background .18s,color .18s}
.ink.open{background:var(--gold-bg);color:var(--gold);font-weight:600}
.answer{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
.answer p{margin:8px 0 0;font-size:1.1rem}
.pts{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.pt{display:flex;gap:11px;align-items:flex-start;padding:9px 0}
.pt .box{width:24px;height:24px;border:1.5px solid var(--line);border-radius:6px;
  flex-shrink:0;text-align:center;line-height:22px;font-size:.85rem;color:transparent}
.pt.on .box{background:var(--pine);border-color:var(--pine);color:var(--on-ink)}
.pt .t{font-size:.98rem;color:var(--mute);line-height:1.5}
.pt.on .t{color:var(--ink)}
.pt .sc{font-weight:400;font-size:.74rem;color:var(--mute);margin-left:8px;
  background:var(--paper);padding:1px 7px;border-radius:5px}
.subs{margin:-3px 0 5px 35px;padding-left:12px;border-left:1.5px solid var(--line)}
.pt.sub{padding:5px 0}
.pt.sub .box{width:19px;height:19px;line-height:17px;font-size:.7rem;border-radius:5px}
.pt.sub .t{font-size:.89rem}
.grades{display:flex;gap:8px}
.grades button{flex:1;padding:13px 0;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;text-align:center}
.grades .g-t{display:block;font-size:1rem;font-weight:600}
.grades .g-s{display:block;font-size:.68rem;color:var(--mute);margin-top:2px}
.grades button.g0{border-color:var(--ochre)} .grades button.g0 .g-t{color:var(--ochre)}
.grades button.g2{border-color:var(--pine)} .grades button.g2 .g-t{color:var(--pine)}
.errbox{background:var(--card);border-radius:12px;padding:14px}
.errbox .chip{padding:11px 20px;font-size:.95rem;background:var(--paper);border-radius:9px}
.done{text-align:center;padding-top:70px}
.done .n{font-size:4.6rem;line-height:1;display:block}

/* ---- forms ---- */
.field{margin-top:12px}
.input,.ta,select.input{width:100%;padding:12px;background:var(--paper);border:none;
  border-radius:9px;font-size:1rem;margin-top:7px;-webkit-appearance:none}
.ta{min-height:110px;line-height:1.8;resize:vertical}
.tool{display:inline-block;padding:9px 15px;margin:8px 8px 0 0;background:var(--paper);
  border-radius:9px;font-size:.88rem;color:var(--ink-soft)}
.tool.warn{color:var(--ochre)}
.tip{display:block;font-size:.76rem;color:var(--mute);margin-top:7px;line-height:1.6}
.types{display:flex;gap:8px;margin-top:9px}
.types button{flex:1;padding:11px 7px;background:var(--paper);border-radius:11px;
  border:1.5px solid transparent;text-align:left}
.types button.on{background:var(--card);border-color:var(--ink)}
.types .tn{display:block;font-size:.88rem;font-weight:600}
.types .td{display:block;font-size:.66rem;color:var(--mute);line-height:1.35;margin-top:2px}
.ptrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.ptrow .i{width:20px;font-size:.8rem;color:var(--mute)}
.ptrow input{flex:1;padding:10px;background:var(--paper);border:none;border-radius:8px;font-size:.95rem}
.ptrow .x{padding:0 8px;color:var(--ochre);font-size:.85rem}
.ptblock{padding:10px 0 4px;border-bottom:1px dashed var(--line)}
.ptblock:last-child{border-bottom:none}
.ptrow.sub{margin-left:26px}
.ptrow.sub .i{width:12px;text-align:center}
.ptrow.sub input{padding:8px 10px;font-size:.9rem;background:var(--subtle)}
.tool.mini{margin-left:28px;padding:6px 12px;font-size:.78rem;background:transparent;
  border:1px dashed var(--line);color:var(--mute)}
.chiprow{display:flex;overflow-x:auto;gap:0;margin-top:9px;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{white-space:nowrap;flex-shrink:0;margin:0 7px 0 0;padding:6px 13px;font-size:.82rem;background:var(--paper)}
.chiprow .chip.on{background:var(--ink);color:var(--on-ink)}
.taxchip{display:inline-flex;align-items:stretch;flex-shrink:0;margin:0 7px 0 0;
  border-radius:999px;background:var(--paper);overflow:hidden;color:var(--ink-soft)}
.taxchip .pick{padding:6px 6px 6px 13px;font-size:.82rem;white-space:nowrap}
.taxchip .kill{padding:6px 10px 6px 5px;font-size:.82rem;color:var(--mute);line-height:1}
.taxchip.on{background:var(--ink);color:var(--on-ink)}
.taxchip.on .kill{color:var(--on-ink-muted)}
#thumb{width:100%;border-radius:9px;margin-top:12px;display:block}

/* ---- list ---- */
#filters{display:flex;overflow-x:auto;gap:0;padding-bottom:2px;-webkit-overflow-scrolling:touch}
#filters::-webkit-scrollbar{display:none}
#filters .chip{white-space:nowrap;background:var(--card);flex-shrink:0}
#filters .chip.on{background:var(--ink)}
.searchcard{background:var(--card);border-radius:14px;padding:14px;margin-bottom:13px}
.searchwrap{display:flex;align-items:center;gap:9px;margin-top:7px;padding:0 13px;
  background:var(--paper);border:2px solid var(--ink-soft);border-radius:11px}
.searchwrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
.searchwrap .searchic{font-size:1rem;flex-shrink:0;filter:grayscale(1);opacity:.75}
.searchwrap .searchinput{width:100%;min-width:0;padding:12px 0;border:0;outline:0;
  background:transparent;color:var(--ink);font:inherit}
.searchwrap .searchinput::placeholder{color:var(--mute);opacity:1}
.item{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.item .top{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:.72rem;color:var(--mute)}
.item .badge{padding:2px 8px;background:var(--paper);border-radius:5px;color:var(--ink-soft)}
.item .top .sp{flex:1}
.item .due.hot{color:var(--gold);font-weight:600}
.item .tx{font-size:.98rem;line-height:1.55}
.item .meta{margin-top:7px;font-size:.72rem;color:var(--mute)}
.item .meta .lp{color:var(--ochre);margin-right:9px}
.item .meta .et{background:var(--ink-soft);color:var(--on-ink);padding:1px 7px;border-radius:5px;margin-right:9px}

/* ---- stats ---- */
.grid{display:flex;flex-wrap:wrap;gap:12px}
.cell{width:calc(50% - 6px);background:var(--card);border-radius:12px;padding:16px}
.cell .v{display:block;font-size:2rem;line-height:1.15}
.cell .k{display:block;font-size:.74rem;color:var(--mute);margin-top:1px}

/* ---- listen ---- */
.lsn{text-align:center;padding:20px 0}
.lsn .now{font-size:1.12rem;line-height:1.9;min-height:120px;
  display:flex;align-items:center;justify-content:center;text-align:left}
.lsn .play{width:88px;height:88px;border-radius:50%;background:var(--ink);color:var(--on-ink);
  font-size:1.9rem;margin:0 auto;display:flex;align-items:center;justify-content:center}
.lsn .play.on{background:var(--gold)}
.lsn .transport{display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;
  gap:12px;margin:16px 0 8px}
.lsn .transport .skip{min-height:48px;padding:10px 8px;background:var(--paper);
  border-radius:10px;font-size:.9rem}
.lsn .ctl{display:flex;gap:10px;justify-content:center;margin-top:12px}
.lsn .ctl button{flex:1;padding:10px 12px;background:var(--paper);border-radius:9px;font-size:.9rem}
.lsn .listen-hint{text-align:left;margin-top:14px}
.lsn .listen-answer{text-align:left;margin-top:14px;background:var(--subtle);border-radius:10px;
  padding:13px 14px;line-height:1.75}
.listen-answer ol{margin:7px 0 0;padding-left:1.4em}
.listen-answer li{padding:3px 0}
.listen-answer ul{margin:2px 0 1px;padding-left:1.35em;color:var(--ink-soft)}
.seg{display:flex;gap:0;background:var(--paper);border-radius:9px;padding:3px;margin-top:9px}
.seg button{flex:1;padding:9px 2px;border-radius:7px;font-size:.85rem;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}


/* ---- AI 自动录入 ---- */
#aiPane{position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px)}
#aiPane .inner{max-width:640px;margin:0 auto}
.aihead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.aihead .t{flex:1;font-size:1.05rem;font-weight:600}
.aihead button{color:var(--mute);font-size:.9rem;padding:4px 6px}
.aibig{display:block;width:100%;padding:15px;border-radius:12px;background:var(--gold-bg);
  color:var(--gold-ink);font-weight:600;text-align:center;font-size:1rem;margin-bottom:10px}
.aibig.off{background:var(--paper);color:var(--mute);font-weight:400}
.warn{background:var(--gold-bg);border-left:3px solid var(--gold);padding:9px 12px;
  border-radius:0 8px 8px 0;font-size:.82rem;line-height:1.6;margin-top:9px;color:var(--gold-ink)}
.res{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
.res img{width:100%;border-radius:9px;margin-bottom:12px;display:block}
.res .lbl{font-size:.72rem;letter-spacing:.12em;color:var(--mute);display:block;margin-top:12px}
.res .fld{width:100%;padding:10px;background:var(--paper);border:none;border-radius:8px;
  font-size:.95rem;margin-top:5px;line-height:1.7}
.res textarea.fld{min-height:80px;resize:vertical}
.res .acts{display:flex;gap:9px;margin-top:14px}
.res .acts button{flex:1;padding:13px 0;border-radius:10px;font-size:.95rem;font-weight:600}
.res .keep{background:var(--ink);color:var(--on-ink)}
.res .drop{background:transparent;color:var(--ochre);border:1.5px solid var(--danger-line)}
.res .two{display:flex;gap:14px;margin-top:12px;font-size:.85rem}
.res .two label{display:flex;align-items:center;gap:6px;color:var(--ink-soft)}
.prog{height:6px;background:var(--progress);border-radius:999px;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.unver{display:inline-block;background:var(--gold-bg);color:var(--gold-ink);font-size:.66rem;
  padding:2px 8px;border-radius:5px;margin-left:6px;vertical-align:middle}

/* ---- 提示 ---- */
.hintbtn{display:inline-block;padding:9px 18px;border-radius:10px;background:var(--gold-bg);
  color:var(--gold-ink);font-size:.9rem;font-weight:600;margin-top:18px}
.hintbox{margin-top:18px;background:var(--gold-bg);border-left:3px solid var(--gold);
  padding:12px 14px;border-radius:0 9px 9px 0;font-size:.96rem;line-height:1.75;color:var(--gold-ink)}
.hintbox .eyebrow{color:var(--gold-ink);opacity:.78;margin-bottom:3px}

/* ---- 段位 ---- */
.rankcard{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;
  padding:13px 15px;margin-bottom:14px}
.rankcard .em{width:62px;height:62px;flex-shrink:0;line-height:0}
.rankcard .tx{flex:1;min-width:0;display:block}
.rankcard .tier{display:block;font-size:1.06rem;font-weight:600;letter-spacing:.02em}
.rankcard .sub{display:block;font-size:.78rem;color:var(--mute);margin-top:2px;line-height:1.5}
.rankcard .em svg{display:block;width:62px;height:62px}
.rankcard .go{color:var(--mute);font-size:1.1rem;flex-shrink:0}
.stars{display:flex;gap:5px;margin-top:6px;line-height:0}
.stars svg{width:16px;height:16px}
#rankPane{position:fixed;inset:0;z-index:55;background:var(--paper);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
#rankPane .inner{max-width:640px;margin:0 auto}
.bigem{text-align:center;padding:6px 0 2px;line-height:0}
.bigem svg{width:186px;height:186px}
.bigname{text-align:center;font-size:1.5rem;font-weight:600;letter-spacing:.04em;margin-top:8px}
.bigsub{text-align:center;color:var(--mute);font-size:.85rem;margin-top:3px}
.bigstars{display:flex;gap:10px;justify-content:center;margin-top:14px;line-height:0}
.bigstars svg{width:30px;height:30px}
.kingpts{text-align:center;margin-top:12px}
.kingpts .v{font-size:3.2rem;line-height:1}
.ladder{display:flex;gap:4px;margin-top:6px}
.ladder .lv{flex:1;text-align:center;opacity:.28;line-height:0}
.ladder .lv.on{opacity:1}
.ladder .lv svg{width:100%;height:auto;max-width:52px}
.ladder .lv b{display:block;font-size:.6rem;color:var(--mute);margin-top:3px;font-weight:400;line-height:1.3}
.logrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.logrow i{width:16px;height:16px;border-radius:4px;background:var(--log-empty);display:block}
.logrow i.d{background:var(--pine)} .logrow i.m{background:var(--miss)} .logrow i.h{background:var(--gold)}
.lgd{display:flex;gap:14px;margin-top:10px;font-size:.74rem;color:var(--mute);flex-wrap:wrap}
.lgd span{display:flex;align-items:center;gap:5px}
.lgd s{width:11px;height:11px;border-radius:3px;display:block;text-decoration:none}

.stepper{display:flex;align-items:center;gap:12px;margin-top:10px}
.stepper button{width:44px;height:44px;border-radius:11px;background:var(--paper);font-size:1.3rem}
.stepper .v{font-size:1.7rem;min-width:56px;text-align:center}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:90;
  background:var(--toast-bg);color:var(--toast-ink);padding:11px 20px;border-radius:11px;
  font-size:.9rem;opacity:0;transition:opacity .22s;pointer-events:none;max-width:80%}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="app"></div>

<nav id="tabs">

<script>
'use strict';

const APP_VERSION = 'v11';
let appSWRegistration = null;
let appSWReloading = false;

/* =======================================================================
   1. 存储层 —— IndexedDB。题目文本一个表，图片 Blob 一个表。
   ======================================================================= */
const DB = (()=>{
  let p;
  function open(){
    if(p) return p;
    p = new Promise((res,rej)=>{
      const r = indexedDB.open('beishu',1);
      r.onupgradeneeded = e=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('cards'))  db.createObjectStore('cards',{keyPath:'id'});
        if(!db.objectStoreNames.contains('images')) db.createObjectStore('images');
      };
      r.onsuccess = ()=>res(r.result);
      r.onerror   = ()=>rej(r.error);
    });
    return p;
  }
  async function tx(store,mode,fn){
    const db = await open();
    return new Promise((res,rej)=>{
      const t = db.transaction(store,mode);
      const s = t.objectStore(store);
      let out;
      try{ out = fn(s); }catch(e){ rej(e); return; }
      t.oncomplete = ()=>res(out && typeof out==='object' && ('result' in out) ? out.result : out);
      t.onerror = ()=>rej(t.error);
    });
  }
  return {
    allCards : ()=>tx('cards','readonly', s=>s.getAll()),
    putCard  : c =>tx('cards','readwrite',s=>s.put(c)),
    delCard  : id=>tx('cards','readwrite',s=>s.delete(id)),
    putImage : (k,b)=>tx('images','readwrite',s=>s.put(b,k)),
    getImage : k =>tx('images','readonly', s=>s.get(k)),
    delImage : k =>tx('images','readwrite',s=>s.delete(k)),
    imageKeys: ()=>tx('images','readonly', s=>s.getAllKeys())
  };
})();

/* =======================================================================
   2. 领域逻辑 —— 间隔重复、队列、挖空解析
   ======================================================================= */
const DAY = 864e5, MIN = 6e4;
const SUBJECTS = ['中国古代史','中国近代史','中国现代史','世界古代史','世界近代史','世界现代史','教资科目一','教资科目二'];
const ERRTYPES = ['不会','记混','看错题'];
const TYPENAME = {cloze:'挖空', qa:'问答', points:'采分点'};

/* ---- 归类：科目（大类）+ 考点（子项，存在 tags[0]）---- */
const topicOf = c => (((c&&c.tags)||[])[0]||'').trim();
const locTime = c => Number((c&&c.locationAt)||(c&&c.created)||0);

// 删除分类只隐藏这个选项，不碰已经录好的题；重新输入同名分类即可恢复。
const CAT = {
  key:'bs_hidden_categories',
  get(){
    let r={}; try{ r=JSON.parse(localStorage.getItem(this.key)||'{}')||{}; }catch(e){}
    return {
      subjects:Array.isArray(r.subjects) ? r.subjects.map(String) : [],
      topics:r.topics && typeof r.topics==='object' ? r.topics : {}
    };
  },
  set(r){ localStorage.setItem(this.key,JSON.stringify(r)); },
  isSubjectHidden(sub){ return this.get().subjects.includes(String(sub||'').trim()); },
  isTopicHidden(sub,topic){
    const r=this.get(), a=r.topics[String(sub||'').trim()];
    return Array.isArray(a) && a.includes(String(topic||'').trim());
  },
  hideSubject(sub){
    sub=String(sub||'').trim(); if(!sub) return;
    const r=this.get(); if(!r.subjects.includes(sub)) r.subjects.push(sub); this.set(r);
  },
  hideTopic(sub,topic){
    sub=String(sub||'').trim(); topic=String(topic||'').trim(); if(!sub||!topic) return;
    const r=this.get(); if(!Array.isArray(r.topics[sub])) r.topics[sub]=[];
    if(!r.topics[sub].includes(topic)) r.topics[sub].push(topic); this.set(r);
  },
  unhideSubject(sub){
    sub=String(sub||'').trim(); if(!sub) return;
    const r=this.get(), n=r.subjects.filter(x=>x!==sub);
    if(n.length!==r.subjects.length){ r.subjects=n; this.set(r); }
  },
  unhideTopic(sub,topic){
    sub=String(sub||'').trim(); topic=String(topic||'').trim(); if(!sub||!topic) return;
    const r=this.get(), a=Array.isArray(r.topics[sub])?r.topics[sub]:[];
    const n=a.filter(x=>x!==topic);
    if(n.length!==a.length){ if(n.length) r.topics[sub]=n; else delete r.topics[sub]; this.set(r); }
  }
};

// 内置科目 + 自己写过的科目；最近用过的排在前面
function allSubjects(includeHidden){
  const used = {}, builtIn = {};
  SUBJECTS.forEach((s,i)=>{ used[s]=0; builtIn[s]=i; });
  S.cards.forEach(c=>{ const s=(c.subject||'').trim();
    if(s) used[s] = Math.max(used[s]||0, locTime(c)); });
  const last = LAST.raw();
  if(last.sub) used[last.sub] = Math.max(used[last.sub]||0, Number(last.at||0));
  return Object.keys(used).filter(s=>includeHidden || !CAT.isSubjectHidden(s)).sort((a,b)=>(used[b]-used[a]) ||
    ((builtIn[a]??999)-(builtIn[b]??999)) || a.localeCompare(b,'zh-CN'));
}
// 某个科目下用过的考点，最近录入的排前面；不传科目就是全部
function allTopics(sub,includeHidden){
  const m = {};
  S.cards.forEach(c=>{
    const cs=(c.subject||'').trim();
    if(sub && cs!==sub) return;
    const t = topicOf(c);
    if(!includeHidden && (CAT.isSubjectHidden(cs)||CAT.isTopicHidden(cs,t))) return;
    if(t) m[t] = Math.max(m[t]||0, locTime(c));
  });
  const last = LAST.raw();
  if(last.topic && (!sub || last.sub===sub) && (includeHidden ||
      (!CAT.isSubjectHidden(last.sub)&&!CAT.isTopicHidden(last.sub,last.topic))))
    m[last.topic] = Math.max(m[last.topic]||0, Number(last.at||0));
  return Object.keys(m).sort((a,b)=>m[b]-m[a]);
}

// 题库里最近录入的归类：本地记忆丢了、或刚导入备份时也能自动找回
function newestCardLocation(){
  const c = S.cards.slice().sort((a,b)=>locTime(b)-locTime(a)).find(x=>{
    const sub=(x.subject||'').trim(), topic=topicOf(x);
    return sub && !CAT.isSubjectHidden(sub) && !CAT.isTopicHidden(sub,topic);
  });
  if(!c || !(c.subject||'').trim()) return null;
  return {sub:(c.subject||'').trim(), topic:topicOf(c), at:locTime(c)};
}

// 上一次录题归到哪儿，下一道题默认接着用
const LAST = {
  raw(){ try{ return JSON.parse(localStorage.getItem('bs_last')||'{}'); }catch(e){ return {}; } },
  get(){
    const saved = this.raw(), fromCards = newestCardLocation();
    const savedOK = saved.sub && !CAT.isSubjectHidden(saved.sub) &&
      !CAT.isTopicHidden(saved.sub,saved.topic||'');
    if(!savedOK) return fromCards || {};
    if(fromCards && fromCards.at > Number(saved.at||0)) return fromCards;
    return saved;
  },
  set(sub,topic){ localStorage.setItem('bs_last',
    JSON.stringify({sub:(sub||'').trim(), topic:(topic||'').trim(), at:Date.now()})); }
};

// 最近几组「科目 · 子项」，录题页一点就能整组填入
function recentLocations(limit){
  const out = [], seen = {};
  const add = x=>{
    if(!x || !x.sub) return;
    if(CAT.isSubjectHidden(x.sub)||CAT.isTopicHidden(x.sub,x.topic||'')) return;
    const key = x.sub+'\u0000'+(x.topic||'');
    if(seen[key]) return;
    seen[key]=1; out.push({sub:x.sub, topic:x.topic||'', at:Number(x.at||0)});
  };
  add(LAST.get());
  S.cards.slice().sort((a,b)=>locTime(b)-locTime(a)).forEach(c=>
    add({sub:(c.subject||'').trim(), topic:topicOf(c), at:locTime(c)}));
  return out.slice(0, limit||8);
}

/* ---- 采分点：一条可以是字符串（老数据），也可以是 {t:'主点', subs:['小点']} ---- */
function ptObj(p){
  if(p && typeof p==='object')
    return {t:String(p.t||''), subs:(p.subs||[]).map(x=>String(x==null?'':x))};
  return {t:String(p==null?'':p), subs:[]};
}
const ptsOf = c => (((c&&c.points)||[])).map(ptObj);
// 存盘时：没有小点的还原成一句字符串，备份文件才不会变胖
function ptPack(o){
  const t = (o.t||'').trim(), subs = (o.subs||[]).map(s=>String(s).trim()).filter(Boolean);
  return subs.length ? {t:t, subs:subs} : t;
}
const ptClean = list => list.map(ptObj).map(ptPack)
  .filter(p => typeof p==='string' ? !!p : (p.t || p.subs.length));
// 主点连同小点铺平成一段文字，搜索和朗读用
const ptFlat = c => ptsOf(c).map(p=>[p.t].concat(p.subs).join(' ')).join(' ');
// 文本框 ⇄ 采分点：缩进或以 ·-• 开头的行算上一条的小点
function linesToPts(txt){
  const out = [];
  String(txt||'').split(/\n/).forEach(raw=>{
    if(!raw.trim()) return;
    const isSub = /^(\s|[-·•*—])/.test(raw);
    const t = raw.replace(/^[\s]*[-·•*—]?[\s]*/,'').trim();
    if(!t) return;
    if(isSub && out.length) out[out.length-1].subs.push(t);
    else out.push({t:t, subs:[]});
  });
  return out;
}
const ptsToLines = arr => (arr||[]).map(ptObj)
  .map(p=>[p.t].concat(p.subs.map(s=>'  · '+s)).join('\n')).join('\n');

function blankCard(){
  const l = LAST.get();
  const sub = l.sub || allSubjects()[0] || '未分类';
  const topic = l.sub===sub ? (l.topic||'') : '';
  return {id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    type:'points', subject:sub, tags:topic?[topic]:[],
    front:'', back:'', points:[{t:'',subs:[]}],
    hint:'', image:'', created:Date.now(), due:Date.now(), interval:0, ease:2.5,
    reps:0, lapses:0, step:0, errorType:null, history:[]};
}

/* ---- 复习策略：三档遗忘曲线 ---- */
const EBB = [5*MIN, 30*MIN, 12*60*MIN, DAY, 2*DAY, 4*DAY, 7*DAY, 15*DAY, 30*DAY, 60*DAY];
const STRATS = {
  ebb : {n:'艾宾浩斯',
         d:'固定阶梯：5 分 → 30 分 → 12 时 → 1 天 → 2 天 → 4 天 → 7 天 → 15 天 → 30 天 → 60 天。记得就往前走一格，模糊原地踏步，忘了退回第一格。新东西刚上手时最有效，代价是头两天要多刷几遍。'},
  sm2 : {n:'标准',
         d:'每道题记自己的难易度，记得就指数拉长：1 → 3 → 8 → 20 天……难题自动来得勤，简单题自动往后躲。日常推进用这个。'},
  slow: {n:'宽松',
         d:'间隔比标准再拉长约六成，每天要做的题明显变少。题库太大做不完、或者临考只想把重点滚一遍时用。'}
};
const strat = ()=> localStorage.getItem('bs_strat') || 'sm2';

// grade: 0 忘了 / 1 模糊 / 2 记得
function schedule(card, g){
  const now = Date.now(), c = Object.assign({}, card);
  c.reps = c.reps||0; c.lapses = c.lapses||0; c.ease = c.ease||2.5;
  c.interval = c.interval||0; c.step = c.step||0;
  const st = strat();

  if(st==='ebb'){
    if(g===0){ c.lapses++; c.step = 0; c.reps = 0; }
    else if(g===2){ c.step = Math.min(EBB.length-1, c.step+1); c.reps++; }
    else { c.reps++; }                                   // 模糊：原地踏步
    const ms = EBB[c.step];
    c.due = now + ms;
    c.interval = ms/DAY;
  }else{
    const slow = st==='slow';
    if(g===0){
      c.lapses++; c.ease = Math.max(1.3, c.ease-0.2);
      c.reps = 0; c.interval = 0; c.due = now + 10*MIN;   // 当天再来一次
    }else if(g===1){
      c.ease = Math.max(1.3, c.ease-0.15);
      c.interval = c.interval<1 ? 1 : Math.max(1, Math.round(c.interval*(slow?1.5:1.2)));
      c.reps++; c.due = now + c.interval*DAY;
    }else{
      c.ease = Math.min(3.0, c.ease+0.05);
      c.interval = c.reps===0 ? (slow?2:1)
                 : c.reps===1 ? (slow?5:3)
                 : Math.round(c.interval*c.ease*(slow?1.25:1));
      c.interval = Math.max(1, c.interval);
      c.reps++; c.due = now + c.interval*DAY;
    }
  }
  c.history = (c.history||[]).concat([{t:now,g:g}]).slice(-40);
  c.lastReview = now;
  return c;
}

function preview(card,g){
  const ms = schedule(card,g).due - Date.now();
  if(ms < 60*MIN) return Math.round(ms/MIN)+' 分钟';
  if(ms < DAY)    return Math.round(ms/(60*MIN))+' 小时';
  const d = Math.round(ms/DAY);
  return d<30 ? d+' 天' : (d/30).toFixed(1)+' 个月';
}

const isDue = (c,at)=> (c.due||0) <= (at||Date.now());

// 「记混」的题排最前，并按知识点聚在一起对比
function buildQueue(cards){
  const now = Date.now(), due = cards.filter(c=>isDue(c,now));
  const key = c => topicOf(c) || c.subject || '';
  const mix = due.filter(c=>c.errorType==='记混')
                 .sort((a,b)=> key(a).localeCompare(key(b)) || (a.due-b.due));
  const rest = due.filter(c=>c.errorType!=='记混').sort((a,b)=>(a.due||0)-(b.due||0));
  return mix.concat(rest);
}

function parseCloze(text){
  const segs=[], re=/【([^】]*)】/g; let last=0,m;
  while((m=re.exec(text))!==null){
    if(m.index>last) segs.push({t:text.slice(last,m.index),hide:false});
    segs.push({t:m[1],hide:true,open:false});
    last = re.lastIndex;
  }
  if(last<text.length) segs.push({t:text.slice(last),hide:false});
  if(!segs.length) segs.push({t:text,hide:false});
  return segs;
}

const plain   = t => (t||'').replace(/[【】]/g,'');
const esc     = t => (t||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const summary = (c,n)=>{ const s = plain(c.front) || (c.image?'［图片题］':'（空）');
                         return s.length>(n||34) ? s.slice(0,n||34)+'…' : s; };
function dueText(c){
  const ms = (c.due||0)-Date.now();
  if(ms<=0) return '待复习';
  const d = Math.round(ms/DAY);
  return d<1 ? '今天稍后' : d===1 ? '明天' : d<30 ? d+' 天后' : (d/30).toFixed(1)+' 个月后';
}

// 「今天」从凌晨 0 点算起
function dayStart(t){ const d = t?new Date(t):new Date();
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); }
function dkey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
                       +'-'+String(d.getDate()).padStart(2,'0'); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){
  const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* =======================================================================
   3. 全局状态
   ======================================================================= */
const S = {cards:[], tab:'today', draft:null, editing:false,
           filter:'all', topic:'', kw:'', imgURL:{},
           fontSize:localStorage.getItem('bs_font')||'17', countdownEditing:false};
const $   = s => document.querySelector(s);
const app = ()=>document.getElementById('app');

/* 首页目标倒计时：单独使用新键，不碰题库和 API Key */
const COUNTDOWN = {
  key:'bs_countdown',
  get(){
    try{
      const c = JSON.parse(localStorage.getItem(this.key)||'{}')||{};
      return {name:String(c.name||'').trim(), date:String(c.date||'').trim()};
    }catch(e){ return {name:'',date:''}; }
  },
  set(c){ localStorage.setItem(this.key, JSON.stringify(c)); },
  clear(){ localStorage.removeItem(this.key); }
};
function validCountdownDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
  if(!m) return false;
  const y=+m[1], mo=+m[2], d=+m[3], x=new Date(y,mo-1,d);
  return x.getFullYear()===y && x.getMonth()===mo-1 && x.getDate()===d;
}
function countdownDays(s){
  const [y,m,d] = s.split('-').map(Number), now = new Date();
  return Math.round((Date.UTC(y,m-1,d)-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/DAY);
}
function countdownDateText(s){
  const [y,m,d] = s.split('-').map(Number);
  return `${y} 年 ${m} 月 ${d} 日`;
}
function countdownHTML(){
  const c = COUNTDOWN.get(), has = validCountdownDate(c.date);
  if(S.countdownEditing){
    return `<div class="card countedit">
      <span class="eyebrow">首页倒计时</span>
      <div class="field"><span class="muted">目标名称</span>
        <input class="input" id="cdName" maxlength="40" placeholder="例如：教师资格考试" value="${esc(c.name)}"></div>
      <div class="field"><span class="muted">目标日期</span>
        <input class="input" id="cdDate" type="date" value="${has?c.date:''}"></div>
      <div class="editacts">
        <button class="save" id="cdSave">保存</button>
        <button id="cdCancel">取消</button>
        ${has?'<button class="clear" id="cdClear">清除</button>':''}
      </div></div>`;
  }
  if(!has){
    return `<button class="countcard empty" id="cdEdit" type="button">
      <span class="cdmain"><span class="eyebrow">目标倒计时</span>
        <span class="cdline">设置目标名称和日期</span>
        <span class="cddate">输入日期后，首页会自动计算还有多少天</span></span>
      <span class="cdedit">设置 ›</span></button>`;
  }
  const name = c.name || '目标日', n = countdownDays(c.date);
  const line = n>0
    ? `距离 <b>${esc(name)}</b> 还有 <strong class="num days">${n}</strong> 天`
    : n===0 ? `<b>${esc(name)}</b> 就是今天`
            : `<b>${esc(name)}</b> 已过去 <strong class="num days">${Math.abs(n)}</strong> 天`;
  return `<button class="countcard" id="cdEdit" type="button">
    <span class="cdmain"><span class="eyebrow">目标倒计时</span>
      <span class="cdline">${line}</span><span class="cddate">${countdownDateText(c.date)}</span></span>
    <span class="cdedit">编辑 ›</span></button>`;
}
function bindCountdown(){
  const edit = $('#cdEdit');
  if(edit) edit.onclick = ()=>{ S.countdownEditing=true; render(); };
  const cancel = $('#cdCancel');
  if(cancel) cancel.onclick = ()=>{ S.countdownEditing=false; render(); };
  const save = $('#cdSave');
  if(save) save.onclick = ()=>{
    const date = $('#cdDate').value;
    if(!validCountdownDate(date)) return toast('请先选择目标日期');
    const name = ($('#cdName').value.trim() || '目标日').slice(0,40);
    COUNTDOWN.set({name,date}); S.countdownEditing=false; render(); toast('倒计时已保存');
  };
  const clear = $('#cdClear');
  if(clear) clear.onclick = ()=>{
    if(!confirm('清除首页倒计时？')) return;
    COUNTDOWN.clear(); S.countdownEditing=false; render(); toast('倒计时已清除');
  };
}

function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1800);
}

async function imgURLFor(key){
  if(!key) return '';
  if(S.imgURL[key]) return S.imgURL[key];
  const blob = await DB.getImage(key);
  if(!blob) return '';
  return (S.imgURL[key] = URL.createObjectURL(blob));
}

async function saveCard(c){ await DB.putCard(c);
  const i = S.cards.findIndex(x=>x.id===c.id);
  if(i>=0) S.cards[i]=c; else S.cards.unshift(c); }

async function removeCard(id){
  const c = S.cards.find(x=>x.id===id);
  if(c && c.image){ await DB.delImage(c.image); delete S.imgURL[c.image]; }
  await DB.delCard(id);
  S.cards = S.cards.filter(x=>x.id!==id);
}

/* =======================================================================
   3.5 段位 —— 每天达标 +1 颗星，三颗星升一小段，四小段升一大段

const TIERS = [
  {k:'青铜', c:['#CE9463','#75431D'], a:'#F3D0AA'},
  {k:'白银', c:['#DCE6EC','#7C929F'], a:'#FFFFFF'},
  {k:'黄金', c:['#F5D264','#A9740B'], a:'#FFF4C8'},
  {k:'铂金', c:['#8FE9DB','#207F74'], a:'#E2FFFA'},
  {k:'钻石', c:['#A9C8FF','#2F52BE'], a:'#E8F0FF'},
  {k:'最强王者', c:['#F0D588','#8B4FC9'], a:'#FFF6D6'}
];
const DIVN = ['Ⅳ','Ⅲ','Ⅱ','Ⅰ'];
const KING = 5;
const GOAL_DEFAULT = 20;

let _svgN = 0;
function rankSVG(t, size){

  const top = king ? 30 : 17;      // 盾牌顶边
  const in1 = king ? 40 : 28;      // 内框顶边
  const wh = size ? ` width="${size}" height="${size}"` : '';
  return `<svg viewBox="0 0 120 120"${wh} xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${T.c[0]}"/><stop offset="100%" stop-color="${T.c[1]}"/></linearGradient>
    <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${T.c[1]}"/><stop offset="100%" stop-color="${T.c[0]}"/></linearGradient>
  </defs>
  <g fill="url(#${id}b)" opacity=".95">
    <path d="M32 44 L4 31 L11 41 L31 50 Z"/>
    <path d="M31 52 L2 45 L9 55 L30 59 Z"/>
    <path d="M30 60 L7 61 L14 70 L29 68 Z"/>
    <path d="M88 44 L116 31 L109 41 L89 50 Z"/>
    <path d="M89 52 L118 45 L111 55 L90 59 Z"/>
    <path d="M90 60 L113 61 L106 70 L91 68 Z"/>
  </g>
  ${king?`<path d="M60 3 L71 17 L84 7 L80 28 L40 28 L36 7 L49 17 Z"
      fill="url(#${id}a)" stroke="${T.c[1]}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="60" cy="11" r="3" fill="${T.a}"/>`:''}
  <path d="M60 ${top} L95 ${top+13} V62 C95 85 79 99 60 109 C41 99 25 85 25 62 V${top+13} Z"
    fill="url(#${id}a)" stroke="${T.c[1]}" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M60 ${in1} L87 ${in1+10} V62 C87 80 74 92 60 100 C46 92 33 80 33 62 V${in1+10} Z"
    fill="none" stroke="${T.a}" stroke-width="1.7" opacity=".7"/>
  <path d="M60 46 L79 60 L60 75 L41 60 Z" fill="${T.a}" opacity=".93"/>
  <path d="M60 55 L70 60.5 L60 66.5 L50 60.5 Z" fill="${T.c[1]}"/>
  </svg>`;
}
function starSVG(on){
  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path
    d="M12 1.5 L15.2 8.8 L22.5 12 L15.2 15.2 L12 22.5 L8.8 15.2 L1.5 12 L8.8 8.8 Z"
    fill="${on?'var(--gold)':'none'}" stroke="${on?'var(--gold)':'#C3CDD4'}"
    stroke-width="1.7" stroke-linejoin="round"/></svg>`;
}

const RK = {
  get(){ let r=null; try{ r = JSON.parse(localStorage.getItem('bs_rank')||'null'); }catch(e){}
         return r || {tier:0, div:0, stars:0, pts:0, start:null, log:{}}; },
  set(r){ localStorage.setItem('bs_rank', JSON.stringify(r)); },
  goal(){ const v = parseInt(localStorage.getItem('bs_goal')||'',10);
          return (v>0 && v<=200) ? v : GOAL_DEFAULT; },
  setGoal(v){ localStorage.setItem('bs_goal', String(Math.max(1,Math.min(200,v)))); }
};

const rankName = r => r.tier===KING ? '最强王者' : TIERS[r.tier].k+' '+DIVN[r.div];

// 每天复习了多少题（从各卡的 history 里数）
function dayCounts(){
  const m = {};
  S.cards.forEach(c=>(c.history||[]).forEach(h=>{
    const k = dkey(new Date(h.t)); m[k] = (m[k]||0)+1; }));
  return m;
}
const doneToday = ()=> (dayCounts()[dkey(new Date())] || 0);

function rankUp(r){
  if(r.tier===KING){ r.pts += 10; return; }
  r.stars++;
  if(r.stars>=3){ r.stars = 0; r.div++; }
  if(r.div>3){ r.div = 0; r.tier++; }
  if(r.tier>KING){ r.tier = KING; r.div = 0; r.stars = 0; }
}
function rankDown(r){
  if(r.tier===KING){ r.pts = Math.max(0, r.pts-10); return; }
  r.stars--;
  if(r.stars<0){
    if(r.div>0){ r.div--; r.stars = 2; }
    else if(r.tier>0){ r.tier--; r.div = 3; r.stars = 2; }
    else { r.stars = 0; }          // 青铜Ⅳ 是地板，不再往下掉
  }
}

/* 结算：从开始用的那天算到今天。
   达标 +1 星（王者 +10 分）／一题没做 −1 星（王者 −10 分）／做了没达标 不加不扣。
   今天只加不扣，天还没过完。 */
function settleRank(){
  const r = RK.get(), goal = RK.goal(), cnt = dayCounts(), today = dkey(new Date());
  const before = rankName(r)+r.stars+r.pts;
  if(!r.start) r.start = today;
  const d = new Date(r.start.replace(/-/g,'/'));
  for(let guard=0; guard<400; guard++){
    const k = dkey(d), isToday = (k===today);
    if(k > today) break;
    if(!r.log[k]){
      const n = cnt[k] || 0;
      if(n >= goal){ r.log[k] = 'd'; rankUp(r); }
      else if(!isToday){ r.log[k] = n===0 ? 'm' : 'h'; if(n===0) rankDown(r); }
    }
    if(isToday) break;
    d.setDate(d.getDate()+1);
  }
  RK.set(r);
  if(rankName(r)+r.stars+r.pts !== before) return r;
  return r;
}

function rankCardHTML(){
  const r = RK.get(), goal = RK.goal(), n = doneToday();
  const left = Math.max(0, goal-n);
  return `<div class="rankcard" id="rankGo">
    <span class="em">${rankSVG(r.tier, 62)}</span>
    <span class="tx">
      <span class="tier">${rankName(r)}${r.tier===KING?` · <span class="num">${r.pts}</span> 分`:''}</span>
      <span class="sub">今天 <b class="num">${n}</b>/${goal} 题${
        left===0 ? ' · 今天这颗星拿到了' : ` · 再 ${left} 题就 +1 颗星`}</span>
      ${r.tier===KING ? '' : `<span class="stars">${[0,1,2].map(i=>starSVG(i<r.stars)).join('')}</span>`}
    </span>
    <span class="go">›</span>
  </div>`;
}

function closeRank(){ $('#rankPane').classList.add('hidden');

       <div class="bigsub">到了王者就不看星星了：达标一天 +10 分，缺一天 −10 分。</div>`
    : `<div class="bigstars">${[0,1,2].map(i=>starSVG(i<r.stars)).join('')}</div>
       <div class="bigsub">再 ${3-r.stars} 颗星升到 ${nextName(r)}</div>`}

    <span class="eyebrow">今天</span>

      已复习 <span class="num">${n}</span> / ${goal} 题${n>=goal?'　✓ 达标':''}</div>
    <div class="pbar" style="margin:10px 0 0"><i style="width:${Math.min(100,Math.round(n/goal*100))}%"></i></div>
    <span class="eyebrow" style="margin-top:18px">每天做多少题算达标</span>
    <div class="stepper">
      <button data-goal="-5">−</button>
      <span class="v num" id="goalV">${goal}</span>
      <button data-goal="5">＋</button>
      <span class="muted" style="flex:1">题</span>
    </div>
    <span class="tip">改小一点更容易连上，改大一点升得快。改动只影响以后，已经结算过的日子不会重算。</span>
  </div>

  <div class="card">
    <span class="eyebrow">最近 28 天</span>
    <div class="logrow">${days.map(d=>`<i class="${d.s}"></i>`).join('')}</div>
    <div class="lgd">
      <span><s style="background:var(--pine)"></s>达标 +1 星</span>
      <span><s style="background:var(--gold)"></s>做了没达标 不加不扣</span>
      <span><s style="background:var(--miss)"></s>一题没做 −1 星</span>
    </div>
  </div>

  <div class="card">
    <span class="eyebrow">段位阶梯</span>
    <div class="ladder" style="margin-top:10px">
      ${TIERS.map((T,i)=>`<span class="lv ${i===r.tier?'on':''}">${rankSVG(i,0)}<b>${T.k}</b></span>`).join('')}
    </div>
    <div class="muted" style="margin-top:14px;line-height:1.8">
      青铜到钻石，每段分 Ⅳ Ⅲ Ⅱ Ⅰ 四小段，每小段三颗星。<br>
      达标一天 +1 颗星，攒满三颗自动升一小段；一题没做的日子 −1 颗星，星星扣光就掉一小段。<br>
      青铜 Ⅳ 是地板，最差也就停在那儿。从头爬到最强王者要 60 天达标。

  $('#rkClose').onclick = closeRank;
  $('#rankPane').querySelectorAll('[data-goal]').forEach(b=> b.onclick = ()=>{

function nextName(r){
  const t = {tier:r.tier, div:r.div, stars:2, pts:0};
  rankUp(t);
  return t.tier===KING ? '最强王者' : TIERS[t.tier].k+' '+DIVN[t.div];
}

    b.classList.toggle('on', b.dataset.tab===S.tab));

/* ---------- 今日 ---------- */
function vToday(){
  const q = buildQueue(S.cards);
  const now = new Date();
  const dayStart = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  let done = 0;
  S.cards.forEach(c=>(c.history||[]).forEach(h=>{ if(h.t>=dayStart) done++; }));

  const map = {}; q.forEach(c=>map[c.subject]=(map[c.subject]||0)+1);
  const keys = Object.keys(map).sort((a,b)=>map[b]-map[a]);
  const max  = keys.length ? map[keys[0]] : 1;
  const total = done + q.length;
  const future = S.cards.filter(c=>(c.due||0)>Date.now()).sort((a,b)=>a.due-b.due);
  const mixed = q.filter(c=>c.errorType==='记混').length;

  let hint;
  if(!S.cards.length)   hint = '题库还是空的，从「录题」开始。';
  else if(!q.length)    hint = `题库共 ${S.cards.length} 题，今天不欠账。`;
  else if(q.length>40)  hint = `共 ${S.cards.length} 题。队列有点长，做完前 20 题也算数。`;
  else                  hint = `题库共 ${S.cards.length} 题。`;

  const goal = RK.goal();

  app().innerHTML = `
  <div class="hero">
    <span class="eyebrow">${now.getMonth()+1} 月 ${now.getDate()} 日</span>
    <div><span class="num big">${q.length}</span><span class="unit">题待复习</span></div>
    <div class="muted">${hint}</div>
  </div>
  ${total ? `<div class="pbar"><i style="width:${Math.round(done/total*100)}%"></i></div>
             <div class="muted" style="margin:0 4px 14px">今天已复习 ${done} 题 · 今日目标 ${goal} 题</div>` : '<div style="height:14px"></div>'}
  ${countdownHTML()}
  ${rankCardHTML()}
  ${q.length
    ? `<button class="btn" id="start">开始复习</button>`
    : `<div class="card"><b>今天的队列清空了</b><div class="muted" style="margin-top:4px">
         下一批 ${future.length?dueText(future[0]):'暂无'} 到期。要么现在录几道新题，要么就休息。</div></div>`}
  ${keys.length ? `<div class="card" style="margin-top:14px"><span class="eyebrow">待复习分布</span>
      ${keys.map(k=>`<div class="row"><span class="nm">${k}</span>
        <span class="bar"><i style="width:${Math.round(map[k]/max*100)}%"></i></span>
        <span class="n num">${map[k]}</span></div>`).join('')}</div>` : ''}
  ${mixed ? `<div class="card"><span class="eyebrow">易混专项</span>
      <div style="margin-top:5px;font-size:.92rem">队列里有 ${mixed} 道标记为「记混」的题，已按知识点排到一起，可以对着比。</div></div>`:''}
  <div class="duo">
    <button data-go="add">录一道题</button>
    <button data-go="list">翻题库</button>
  </div>`;

  const s = $('#start'); if(s) s.onclick = ()=>startReview();
  const rg = $('#rankGo'); if(rg) rg.onclick = openRank;
  bindCountdown();
  app().querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=>{ S.tab=b.dataset.go; render(); });
}

/* ---------- 复习 ---------- */
const R = {queue:[], i:0, card:null, segs:[], revealed:false, hinted:false,
           checked:[], subChk:[], sum:[0,0,0]};

function startReview(){
  R.queue = buildQueue(S.cards); R.i = 0; R.sum = [0,0,0];
  if(!R.queue.length){ toast('没有到期的题'); return; }
  $('#review').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  loadCard();
}
function closeReview(){
  $('#review').classList.add('hidden');
  document.body.style.overflow = '';
  render();
}

function loadCard(){
  if(R.i >= R.queue.length){ renderDone(); return; }
  R.card = R.queue[R.i];
  R.segs = R.card.type==='cloze' ? parseCloze(R.card.front) : [];
  R.revealed = false; R.hinted = false;
  const ps = ptsOf(R.card);
  R.checked = ps.map(()=>false);
  R.subChk  = ps.map(p=>p.subs.map(()=>false));
  renderReview();
}

async function renderReview(){
  const c = R.card, el = $('#review .inner');
  // 自动录题已有文字题干时不再展示原截图；旧版留下的卡也立即生效。
  const imgSrc = c.image && !String(c.front||'').trim() ? await imgURLFor(c.image) : '';
  let bodyHTML = '';

  if(c.type==='cloze'){
    bodyHTML = `<div class="qtext">` + R.segs.map((s,i)=>
      s.hide ? `<span class="ink${s.open?' open':''}" data-seg="${i}">${esc(s.t)}</span>`
             : esc(s.t)).join('') + `</div>`;
  }else if(c.type==='qa'){
    bodyHTML = `<div class="qtext">${esc(c.front)}</div>` + (R.revealed
      ? `<div class="answer"><span class="eyebrow">答案</span><p>${esc(c.back)}</p></div>` : '');
  }else{
    const ps = ptsOf(c);
    bodyHTML = `<div class="qtext">${esc(c.front)}</div>` + (R.revealed
      ? `<div class="pts"><span class="eyebrow">答对哪几点，就点亮哪几点</span>
          ${ps.map((p,i)=>`
            <div class="pt${R.checked[i]?' on':''}" data-pt="${i}">
              <span class="box">✓</span><span class="t">${esc(p.t)}${
                p.subs.length?`<b class="sc">${(R.subChk[i]||[]).filter(Boolean).length}/${p.subs.length}</b>`:''}</span></div>
            ${p.subs.length?`<div class="subs">${p.subs.map((s,j)=>
              `<div class="pt sub${(R.subChk[i]||[])[j]?' on':''}" data-pt="${i}" data-sub="${j}">
                 <span class="box">✓</span><span class="t">${esc(s)}</span></div>`).join('')}</div>`:''}`).join('')}
          <div class="muted" style="margin-top:9px">命中 ${R.checked.filter(Boolean).length} / ${ps.length}</div></div>`
      : `<div class="muted" style="margin-top:14px">先自己在心里（或嘴上）答一遍，再对采分点。</div>`);
  }

  el.innerHTML = `
    <div class="rtop">
      <span class="pos num">${Math.min(R.i+1,R.queue.length)} / ${R.queue.length}</span>
      <span class="crumb">${c.subject}${c.tags&&c.tags.length?' · '+c.tags.join(' · '):''}${c.aiUnverified?'<span class="unver">未核对</span>':''}</span>
      <button id="rSpeak">朗读</button>
      <button id="rEdit">编辑</button>
      <button id="rClose">收起</button>
    </div>
    <div class="rprog"><i style="width:${Math.round(R.i/R.queue.length*100)}%"></i></div>
    <div class="stage">${imgSrc?`<img src="${imgSrc}" id="rImg">`:''}${bodyHTML}
      ${(c.hint||'').trim() ? (R.hinted
        ? `<div class="hintbox"><span class="eyebrow">提示</span>${esc(c.hint)}</div>`
        : `<button class="hintbtn" id="rHint">给点提示</button>`) : ''}</div>
    ${R.revealed ? `<div class="grades">
        ${[['忘了',0],['模糊',1],['记得',2]].map(([t,g])=>
          `<button class="g${g}" data-g="${g}"><span class="g-t">${t}</span>
             <span class="g-s">${preview(c,g)}</span></button>`).join('')}
      </div>`
     : `<button class="btn" id="rReveal">${c.type==='cloze'?'全部揭开':'看答案'}</button>`}`;

  el.querySelectorAll('[data-seg]').forEach(s=> s.onclick = ()=>{
    const i = +s.dataset.seg; R.segs[i].open = !R.segs[i].open; renderReview(); });
  el.querySelectorAll('[data-pt]').forEach(p=> p.onclick = ()=>{
    const i = +p.dataset.pt;
    if(!R.subChk[i]) R.subChk[i] = [];
    if(p.dataset.sub !== undefined){            // 点的是小点：只翻它自己
      const j = +p.dataset.sub;
      R.subChk[i][j] = !R.subChk[i][j];
      if(R.subChk[i].length) R.checked[i] = R.subChk[i].every(Boolean);
    }else{                                      // 点的是主点：底下的小点跟着走
      R.checked[i] = !R.checked[i];
      R.subChk[i] = R.subChk[i].map(()=>R.checked[i]);
    }
    renderReview(); });
  el.querySelectorAll('[data-g]').forEach(b=> b.onclick = ()=>doGrade(+b.dataset.g));

  const rv = $('#rReveal');
  if(rv) rv.onclick = ()=>{ R.revealed = true; R.segs.forEach(s=>s.open=true); renderReview(); };
  const rh = $('#rHint'); if(rh) rh.onclick = ()=>{ R.hinted = true; renderReview(); };
  $('#rClose').onclick = closeReview;
  $('#rEdit').onclick  = ()=>{ closeReview(); openEdit(c.id); };
  $('#rSpeak').onclick = ()=>{ speakOne(c); };
  const im = $('#rImg'); if(im) im.onclick = ()=>window.open(imgSrc,'_blank');
}

async function doGrade(g){
  const c = R.card;
  const up = schedule(c,g);
  if(c.type==='points' && ptsOf(c).length)
    up.lastScore = R.checked.filter(Boolean).length+'/'+ptsOf(c).length;
  if(g===2) up.errorType = null;
  await saveCard(up);
  R.sum[g]++;
  const was = RK.get(); const wasName = rankName(was), wasStars = was.stars, wasPts = was.pts;
  const now2 = settleRank();
  if(rankName(now2)!==wasName) toast('升段了 · '+rankName(now2));
  else if(now2.stars>wasStars || now2.pts>wasPts)
    toast(now2.tier===KING ? '今天达标 · +10 分' : '今天达标 · +1 颗星');
  if(g===0) R.queue.push(up);          // 当天队尾再来一次

  if(g<2){ askError(up); }
  else   { R.i++; loadCard(); }
}

function askError(card){
  const el = $('#review .inner');
  const box = document.createElement('div');
  box.className = 'errbox'; box.style.marginTop = '10px';
  box.innerHTML = `<span class="eyebrow">错在哪</span><div style="margin-top:8px">
    ${ERRTYPES.map(t=>`<span class="chip" data-e="${t}">${t}</span>`).join('')}
    <span class="chip" data-e="">不填</span></div>`;
  el.querySelector('.grades').replaceWith(box);
  box.querySelectorAll('[data-e]').forEach(ch=> ch.onclick = async ()=>{
    if(ch.dataset.e){ card.errorType = ch.dataset.e; await saveCard(card); }
    R.i++; loadCard();
  });
}

  $('#review .inner').innerHTML = `<div class="done">
    <span class="eyebrow">这一轮</span>
    <span class="n num">${R.queue.length}</span>
    <div style="font-size:1.1rem;margin-bottom:8px">题过完了</div>
    <div class="muted">记得 ${R.sum[2]} · 模糊 ${R.sum[1]} · 忘了 ${R.sum[0]}</div>
    <div class="muted" style="margin-top:4px">标「忘了」的题今天还会再出现一次。</div>
    <div class="card" style="margin-top:26px;text-align:left">
      <div style="display:flex;align-items:center;gap:13px">
        <span style="width:52px;flex-shrink:0;line-height:0">${rankSVG(r.tier,52)}</span>
        <span style="flex:1">
          <b>${rankName(r)}</b>
          <div class="muted" style="margin-top:2px">${hit
            ? '今天达标了，这颗星到手。'
            : `今天 ${n}/${goal} 题，再做 ${goal-n} 题就 +1 颗星。`}</div>
          ${r.tier===KING?`<div class="muted num" style="margin-top:4px">${r.pts} 分</div>`
            :`<span class="stars">${[0,1,2].map(i=>starSVG(i<r.stars)).join('')}</span>`}
        </span>
      </div>
    </div>
    <button class="btn" id="dBack" style="margin-top:14px">回到今日</button></div>`;
  $('#dBack').onclick = closeReview;
}

/* =======================================================================
   5. 听背 —— 系统语音合成，通勤用
   ======================================================================= */
const L = {queue:null, i:0, playing:false, gap:3, mode:'both', stop:false,
           order:'seq', scope:'due', waiting:false, resume:null, hinted:false,
           answerShown:false, run:0};

function voiceFor(){
  const vs = speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang));
  return vs.find(v=>/Ting|Tingting|婷婷|Chinese/i.test(v.name)) || vs[0] || null;
}
function speak(text){
  return new Promise(res=>{
    if(!text || !text.trim()) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.95;
    const v = voiceFor(); if(v) u.voice = v;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

function frontSpeech(c){ return plain(c.front); }
function backSpeech(c){
  if(c.type==='qa') return c.back;
  if(c.type==='points') return ptsOf(c)
    .map(p=> p.subs.length ? p.t+'：'+p.subs.join('，') : p.t).join('。');
  const m = c.front.match(/【([^】]*)】/g);
  return m ? '关键词：'+m.map(x=>x.replace(/[【】]/g,'')).join('、') : '';
}
function listenAnswerHTML(c){
  if(!c) return '';
  if(c.type==='points'){
    const ps = ptsOf(c).filter(p=>p.t || p.subs.length);
    if(!ps.length) return '<div class="muted">这题还没有填写答案。</div>';
    return `<ol>${ps.map(p=>`<li>${esc(p.t)}${p.subs.length
      ? `<ul>${p.subs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>` : ''}</li>`).join('')}</ol>`;
  }
  const b = backSpeech(c);
  return b && b.trim() ? esc(b).replace(/\n/g,'<br>') : '<div class="muted">这题还没有填写答案。</div>';
}
function speakOne(c){
  speechSynthesis.cancel();
  speak(frontSpeech(c)).then(()=>wait(600)).then(()=>speak(backSpeech(c)));
}

function buildListenQueue(){
  const due = buildQueue(S.cards);
  let list = (L.scope==='all' || !due.length)
    ? S.cards.slice().sort((a,b)=>(a.due||0)-(b.due||0))
    : due;
  if(L.order==='rand') list = shuffle(list.slice());
  return list;
}
function ensureListenQueue(){
  if(L.queue) return;
  L.queue = buildListenQueue(); L.i = 0; L.hinted = false; L.answerShown = false;
}
function reshuffleListen(){
  stopListen(false);
  L.queue = buildListenQueue(); L.i = 0; L.hinted = false; L.answerShown = false;
  vListen();
}

function vListen(){
  ensureListenQueue();
  const c = L.queue[L.i];
  const manual = L.gap===0;

  app().innerHTML = `
  <div class="hero" style="padding-bottom:0">
    <span class="eyebrow">听背</span>
    <div class="muted">${manual
      ? '读题 → 停住等你点「继续」 → 读答案 → 再等你点。想多久想多久，不会自己往下跑。'
      : `读题 → 停 ${L.gap} 秒让你想 → 读答案 → 下一题。走路、坐车、做家务的时候用。`}</div>
  </div>
  ${!L.queue.length ? `<div class="card" style="margin-top:16px">题库是空的，先去录几道题。</div>` : `
  <div class="card lsn">
    <span class="eyebrow">${L.i+1} / ${L.queue.length} · ${c?c.subject:''}${L.order==='rand'?' · 随机':''}</span>
    <div class="now" id="lNow">${c?esc(summary(c,60)):''}</div>
    <div class="transport">
      <button class="skip" id="lPrev">上一题</button>
      ${L.waiting
        ? `<button class="play on" id="lGo" aria-label="继续">▶</button>`
        : `<button class="play${L.playing?' on':''}" id="lPlay" aria-label="${L.playing?'暂停':'播放'}">${L.playing?'❚❚':'▶'}</button>`}
      <button class="skip" id="lNext">下一题</button>
    </div>
    ${L.waiting ? `<div class="muted" style="margin:-2px 0 8px">想好了点播放键，继续往下读</div>` : ''}
    <div class="ctl">
      <button id="lHint">${L.hinted?'收起提示':'提示'}</button>
      <button id="lAnswer">${L.answerShown?'收起答案':'查看答案'}</button>
      <button id="lMiss">这题没记住</button>
    </div>
    ${L.hinted && c && (c.hint||'').trim()
      ? `<div class="hintbox listen-hint"><span class="eyebrow">提示</span>${esc(c.hint)}</div>` : ''}
    ${L.answerShown && c
      ? `<div class="listen-answer"><span class="eyebrow">答案</span>${listenAnswerHTML(c)}</div>` : ''}
  </div>
  <div class="card">
    <span class="eyebrow">按什么顺序</span>
    <div class="seg">
      <button data-ord="seq" class="${L.order==='seq'?'on':''}">按到期先后</button>
      <button data-ord="rand" class="${L.order==='rand'?'on':''}">随机</button>
    </div>
    ${L.order==='rand'?`<button class="tool" id="lShuffle">重新洗一次</button>`:''}

    <span class="eyebrow" style="margin-top:16px">听哪些题</span>
    <div class="seg">
      <button data-sc="due" class="${L.scope==='due'?'on':''}">今天到期的</button>
      <button data-sc="all" class="${L.scope==='all'?'on':''}">整个题库</button>
    </div>

    <span class="eyebrow" style="margin-top:16px">读什么</span>
    <div class="seg">
      <button data-m="both" class="${L.mode==='both'?'on':''}">题目 + 答案</button>
      <button data-m="front" class="${L.mode==='front'?'on':''}">只读题目</button>
    </div>

    <span class="eyebrow" style="margin-top:16px">中间停多久</span>
    <div class="seg">
      ${[2,3,5,8].map(g=>`<button data-gap="${g}" class="${L.gap===g?'on':''}">${g} 秒</button>`).join('')}
      <button data-gap="0" class="${manual?'on':''}">不自动</button>
    </div>
    <div class="tip">${manual
      ? '「不自动」= 停下来等你点「继续」。答案长、想的时间不好估的时候用这个，比来回按暂停省事。'
      : '想的时间不够就选「不自动」，它会停在那儿等你点继续。'}</div>
    <div class="tip">屏幕锁上后 iOS 会暂停朗读。想放兜里听，先把「设置 → 显示与亮度 → 自动锁定」调成「永不」。</div>
  </div>`}`;

  const go = $('#lGo');
  if(go) go.onclick = ()=>{ if(L.resume){ const r = L.resume; L.resume = null; r(); } };
  const pl = $('#lPlay');
  if(pl) pl.onclick = ()=> L.playing ? stopListen() : startListen();
  if(!$('#lPrev')) return;
  $('#lPrev').onclick = ()=>{ jump(-1); };
  $('#lNext').onclick = ()=>{ jump(1); };
  $('#lHint').onclick = ()=>{
    const cur = L.queue[L.i];
    if(!cur || !(cur.hint||'').trim()) return toast('这题还没有填写提示');
    L.hinted = !L.hinted; vListen();
  };
  $('#lAnswer').onclick = ()=>{ L.answerShown = !L.answerShown; vListen(); };
  $('#lMiss').onclick = async ()=>{
    const cur = L.queue[L.i]; if(!cur) return;
    await saveCard(schedule(cur,0));
    toast('已丢回今天的队列');
  };
  app().querySelectorAll('[data-m]').forEach(b=> b.onclick = ()=>{ L.mode=b.dataset.m; vListen(); });
  app().querySelectorAll('[data-gap]').forEach(b=> b.onclick = ()=>{ L.gap=+b.dataset.gap; vListen(); });
  app().querySelectorAll('[data-ord]').forEach(b=> b.onclick = ()=>{
    if(L.order===b.dataset.ord) return; L.order = b.dataset.ord; reshuffleListen(); });
  app().querySelectorAll('[data-sc]').forEach(b=> b.onclick = ()=>{
    if(L.scope===b.dataset.sc) return; L.scope = b.dataset.sc; reshuffleListen(); });
  const sh = $('#lShuffle'); if(sh) sh.onclick = reshuffleListen;
}

function jump(d){
  stopListen(false);
  L.i = Math.max(0, Math.min(L.queue.length-1, L.i+d));
  L.hinted = false; L.answerShown = false;
  startListen();
}
function stopListen(rerender=true){
  L.run++;
  L.stop = true; L.playing = false; speechSynthesis.cancel();
  if(L.resume){ const r = L.resume; L.resume = null; r(); }
  L.waiting = false;
  if(rerender) vListen();
}

// 停顿：秒数到就走；选了「不自动」就停在这儿，等点「继续」
function gapWait(){
  if(L.gap > 0) return wait(L.gap*1000);
  L.waiting = true; vListen();
  return new Promise(r=>{ L.resume = r; }).then(()=>{
    L.waiting = false; L.resume = null;
    if(!L.stop) vListen();
  });
}

async function startListen(){
  const run = ++L.run;
  L.stop = false; L.playing = true; L.waiting = false; vListen();
  const setNow = t=>{ const el = $('#lNow'); if(el) el.textContent = t; };

  while(run===L.run && !L.stop && L.i < L.queue.length){
    const c = L.queue[L.i];
    setNow(plain(c.front));
    await speak(frontSpeech(c));
    if(run!==L.run || L.stop) break;

    await gapWait();
    if(run!==L.run || L.stop) break;

    if(L.mode==='both'){
      const b = backSpeech(c);
      if(b){ setNow(b); await speak(b); }
      if(run!==L.run || L.stop) break;
      if(L.gap===0){ await gapWait(); if(run!==L.run || L.stop) break; }
      else await wait(700);
    }else if(L.gap>0){
      await wait(700);
    }

    L.i++;
    L.hinted = false; L.answerShown = false;
    if(L.i < L.queue.length) vListen();
  }
  if(run===L.run && !L.stop){
    L.playing=false; L.i = Math.min(L.i, L.queue.length-1); vListen(); toast('听完了');
  }
}

const PH = {
  cloze : '例：洋务运动前期口号是【自强】，后期是【求富】。',

// 归类那两排胶囊：点一下就把上面的输入框填上
function subChipHTML(cur){
  return allSubjects().map(s=>
    `<span class="taxchip${s===(cur||'').trim()?' on':''}">
      <button type="button" class="pick" data-sub-v="${esc(s)}">${esc(s)}</button>
      <button type="button" class="kill" data-del-sub="${esc(s)}" aria-label="删除${esc(s)}">×</button>
    </span>`).join('');
}
function topicChipHTML(sub, cur){
  const ts = allTopics((sub||'').trim()).slice(0,20);
  if(!ts.length) return `<span class="muted" style="font-size:.8rem;padding-top:3px">
    这个科目下还没有考点，上面直接写一个就是。</span>`;
  return ts.map(t=>
    `<span class="taxchip${t===(cur||'').trim()?' on':''}">
      <button type="button" class="pick" data-topic-v="${esc(t)}">${esc(t)}</button>
      <button type="button" class="kill" data-del-topic="${esc(t)}" aria-label="删除${esc(t)}">×</button>
    </span>`).join('');
}
function hideSubjectChoice(sub){
  sub=String(sub||'').trim(); if(!sub) return false;
  const n=S.cards.filter(c=>(c.subject||'').trim()===sub).length;
  const msg=`删除科目选项“${sub}”？`+(n
    ? `\n\n已有 ${n} 道题不会被删除，仍能在题库“全部”中找到。`
    : '')+'\n\n以后重新输入同名科目即可恢复。';
  if(!confirm(msg)) return false;
  CAT.hideSubject(sub); return true;
}
function hideTopicChoice(sub,topic){
  sub=String(sub||'').trim(); topic=String(topic||'').trim(); if(!sub||!topic) return false;
  const n=S.cards.filter(c=>(c.subject||'').trim()===sub && topicOf(c)===topic).length;
  const msg=`删除“${sub}”下的考点“${topic}”？`+(n
    ? `\n\n已有 ${n} 道题不会被删除，仍能在题库“全部”中找到。`
    : '')+'\n\n以后重新输入同名考点即可恢复。';
  if(!confirm(msg)) return false;
  CAT.hideTopic(sub,topic); return true;
}
function recentLocHTML(curSub, curTopic){
  const rows = recentLocations(8);
  if(!rows.length) return `<span class="muted" style="font-size:.8rem;padding-top:3px">
    存下第一道题后，这里会显示最近用过的归类。</span>`;
  return rows.map(x=>{
    const on = x.sub===(curSub||'').trim() && x.topic===(curTopic||'').trim();
    return `<button class="chip${on?' on':''}" data-loc-sub="${esc(x.sub)}"
      data-loc-topic="${esc(x.topic)}">${esc(x.sub)}${x.topic?' · '+esc(x.topic):''}</button>`;
  }).join('');
}

function openEdit(id){

  const ap = $('#bAddPt');

  app().querySelectorAll('[data-addsub]').forEach(b=> b.onclick = async ()=>{

  app().querySelectorAll('[data-pi][data-sj]').forEach(inp=> inp.onkeydown = async e=>{

// 图片压缩：长边不超过 1400px，JPEG 质量 0.72
function compress(file){
  return new Promise(res=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const max = 1400;
      let {width:w, height:h} = img;
      if(Math.max(w,h) > max){ const r = max/Math.max(w,h); w = Math.round(w*r); h = Math.round(h*r); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      cv.toBlob(b=>res(b||file), 'image/jpeg', 0.72);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

const blobToDataURL = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });

async function doExport(withImages){
  toast('正在打包…');
  const out = {v:1, at:Date.now(), cards:S.cards, images:{}};
  if(withImages){
    for(const c of S.cards){
      if(!c.image) continue;
      const b = await DB.getImage(c.image);
      if(b) out.images[c.image] = await blobToDataURL(b);
    }
  }else{
    out.cards = S.cards.map(c=>Object.assign({},c,{image:''}));
  }
  const blob = new Blob([JSON.stringify(out)], {type:'application/json'});
  const d = new Date();
  const name = `背书备份-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

async function doImport(e){
  const f = e.target.files[0]; if(!f) return;
  let data;
  try{ data = JSON.parse(await f.text()); }catch(err){ return toast('文件读不出来'); }
  if(!data || !data.cards || !data.cards.length) return toast('备份里没有题目');
  if(!confirm(`导入 ${data.cards.length} 题？id 相同的会被覆盖，其余追加。`)) return;

  for(const key in (data.images||{})){
    const res = await fetch(data.images[key]);
    await DB.putImage(key, await res.blob());
  }
  for(const raw of data.cards){
    const merged = Object.assign(blankCard(), raw);
    await DB.putCard(merged);
  }
  S.cards = await DB.allCards();
  S.imgURL = {};
  const last = newestCardLocation();
  if(last) LAST.set(last.sub, last.topic);  // 导入后下一道自动接着最新归类
  render();
  toast('导入完成');
}

const AI_PROMPT = `你是手写备考笔记整理助手。先在内部判断版面和编号层级，再输出结果。必须遵守：

【先分开题目和答案】
1. front 只能放题目、设问和选项；绝不能放答案、解析或采分点，也不能在 front 里写“题目：”。
2. “答、答案、参考答案、解析”之后的文字全部属于答案。即使没有这些标记，只要标题或设问之后出现成组编号要点，也把这些要点当作答案。
3. 手写页只有一个未编号标题、下面全是编号内容时：未编号标题是 front，编号内容是 points。
4. 没有题目或标题时，front 填“未识别到题目”，不要拿第一条答案冒充题目。
5. 划掉、涂黑、明显删除的字不要录入；看不清的字不要猜造。

【识别所有常见编号并建立层级】
6. 下列写法都可能是一组并列编号：
   中文数字：一、 二、 三、；一. 二. 三.；（一）（二）（三）；(一)(二)(三)
   阿拉伯数字：1、2、3、；1. 2. 3.；1) 2) 3)；（1）（2）（3）；(1)(2)(3)
   圈号数字：①②③④⑤⑥⑦⑧⑨⑩
   也要识别顿号、句点、括号、圈号和手写不规范的等价形式。
7. 编号只是结构标记，不写进 t 或 subs 的正文里。结合缩进、上下位置、编号形式和语义判断层级，不要只按数字大小判断。
8. 同一缩进且编号形式相同的是同级。缩进更深，或出现在某个主项下面的第二套编号，是该主项的子项。例如“一、……”下面的“1. 2. 3.”必须放进这一主项的 subs；如果主项本来用“1、2、3”，其下的“(1)(2)(3)”或“①②③”也放进 subs。
9. points 中每个主项必须统一写成对象 {"t":"主项正文","subs":["子项一","子项二"]}。没有子项也必须写空数组 subs:[]。只支持主项和子项两层；更深层内容合并进最接近的子项，不要另造字段。
10. 保持原文顺序和原意。原文已有答案时只做去编号和分层，不要改写或补充；图片确实没有答案时才可自行作答，并把 answerVerified 设为 false。原文有答案或解析则设为 true。

例：图片内容是“保持好成绩的方法\n一、坚持学习\n  1. 每天复习\n  2. 定时总结\n二、提高效率”，则输出：
front="保持好成绩的方法"
points=[{"t":"坚持学习","subs":["每天复习","定时总结"]},{"t":"提高效率","subs":[]}]

【其他字段】
11. subject 只能从以下列表选一个：中国古代史/中国近代史/中国现代史/世界古代史/世界近代史/世界现代史/教资科目一/教资科目二。
12. topic 填两到六个字的具体考点；hint 填记忆线索，可以写条数、首字、时间或人物，但不要照抄完整答案。

只输出一个合法 JSON 对象，不要 markdown，不要解释，所有键都必须存在：
{"subject":"","topic":"","front":"","points":[{"t":"","subs":[]}],"hint":"","answerVerified":false}`;

function pickJSON(txt){
  let t = (txt||'').trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a<0 || b<a) throw new Error('模型没返回 JSON');
  return JSON.parse(t.slice(a,b+1));
}

// 第二道保险：即使模型把“答①……”塞回题目栏，也在展示前切掉。
function cleanAIFront(front, points){
  let s = String(front||'').trim()
    .replace(/^\s*(?:题目|题干)\s*[:：]\s*/,'');
  if(!s) return '未识别到题目';

  // “答/答案/解析”有时会和第一条要点挤在同一行，例如“答写①……”。
  const answerMark = /\s*(?:参考答案|答案|解析|答(?:题|写)?)\s*[:：]?\s*(?=[①-⑳一二三四五六七八九十（(]|\d+[、.．)）])/;
  const hit = s.search(answerMark);
  if(hit>=0) s = s.slice(0,hit).trim();
  if(!s) return '未识别到题目';

  const bodies = (points||[]).map(ptObj)
    .reduce((a,p)=>a.concat([p.t],p.subs),[])
    .map(x=>String(x).replace(/\s/g,'').trim()).filter(Boolean);
  const numbered = /^\s*(?:[①-⑳]|[（(]?(?:[一二三四五六七八九十]+|\d+)[）)]?[、.．)）]?)[\s、.．)）]*/;
  const lines = s.split(/\n+/), kept = [];
  for(let i=0;i<lines.length;i++){
    const line = lines[i].trim();
    if(!line) continue;
    const body = line.replace(numbered,'').replace(/\s/g,'');
    // 有题目行在前，且编号行与采分点重合，说明答案被重复写进了 front。
    if(kept.length && numbered.test(line) && bodies.some(x=>x===body || x.includes(body) || body.includes(x))) break;
    kept.push(line);
  }
  s = kept.join('\n').trim();
  return s || '未识别到题目';
}

function normalizeAIResult(raw){
  const d = raw && typeof raw==='object' ? raw : {};
  const points = (Array.isArray(d.points) ? d.points : [])
    .map(ptObj).map(p=>({
      t:p.t.trim(),
      subs:p.subs.map(x=>x.trim()).filter(Boolean)
    })).filter(p=>p.t || p.subs.length);
  return {
    subject:String(d.subject||''),
    topic:String(d.topic||''),
    front:cleanAIFront(d.front, points),
    points:points,
    hint:String(d.hint||''),
    answerVerified:d.answerVerified===true
  };
}

async function aiAnalyze(blob){
  const c = AIcfg.get();
  const dataUrl = await blobToDataURL(blob);
  const base = {
    model: c.model, temperature: 0.2,
    messages: [{role:'user', content:[
      {type:'image_url', image_url:{url:dataUrl}},
      {type:'text', text:AI_PROMPT}
    ]}]
  };
  // 思考模式：识题这活儿用不上，关掉省一半输出费用，也快一截。
  // 有的服务商不认这个字段，认不出就自动去掉重发一次。
  const wantThink = c.think === 'on';
  const send = async (withThinking, withJSON) =>{
    let body = Object.assign({}, base);
    if(withThinking) body.thinking = {type: wantThink ? 'enabled' : 'disabled'};
    if(withJSON) body.response_format = {type:'json_object'};
    try{
      return await fetch(c.base, {method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
        body: JSON.stringify(body)});
    }catch(e){
      throw new Error('连不上。多半是浏览器跨域被拦了 —— 看说明书第十节，挂一个中转地址就好。');
    }
  };

  let r = await send(true, true);
  if(!r.ok && (r.status===400 || r.status===422)) r = await send(false, true);
  if(!r.ok && (r.status===400 || r.status===422)) r = await send(false, false);
  if(!r.ok){
    const t = await r.text();
    throw new Error('接口报错 '+r.status+'：'+t.slice(0,140));
  }
  const j = await r.json();
  const msg = j.choices && j.choices[0] && j.choices[0].message;
  let txt = msg ? msg.content : '';
  if(Array.isArray(txt)) txt = txt.map(x=>x.text||'').join('');
  return normalizeAIResult(pickJSON(txt));
}

function bindRes(it,i){
  const box = $(`[data-res="${i}"]`);
  if(box){
    box.querySelectorAll('[data-f]').forEach(f=> f.oninput = ()=>{
      const k = f.dataset.f;
      it.data[k] = k==='points' ? linesToPts(f.value) : f.value;
    });

    const fs=box.querySelector('[data-f="subject"]');
    const ft=box.querySelector('[data-f="topic"]');
    const markSubjects=()=>box.querySelectorAll('[data-sub-v]').forEach(ch=>{
      const w=ch.closest('.taxchip'); if(w) w.classList.toggle('on',ch.dataset.subV===(fs.value||'').trim());
    });
    const paintTopics=()=>{
      const row=box.querySelector('.ai-topic-chips'); if(!row) return;
      row.innerHTML=topicChipHTML((fs.value||'').trim(),(ft.value||'').trim());
      row.querySelectorAll('[data-topic-v]').forEach(ch=>ch.onclick=()=>{
        ft.value=ch.dataset.topicV; it.data.topic=ft.value; paintTopics();
      });
      row.querySelectorAll('[data-del-topic]').forEach(b=>b.onclick=e=>{
        e.stopPropagation();
        const sub=(fs.value||'').trim(), topic=b.dataset.delTopic;
        if(!hideTopicChoice(sub,topic)) return;
        if((ft.value||'').trim()===topic){ ft.value=''; it.data.topic=''; }
        paintTopics(); toast('考点选项已删除');
      });
    };
    box.querySelectorAll('[data-sub-v]').forEach(ch=>ch.onclick=()=>{
      fs.value=ch.dataset.subV; it.data.subject=fs.value;
      markSubjects(); paintTopics();
    });
    box.querySelectorAll('[data-del-sub]').forEach(b=>b.onclick=e=>{
      e.stopPropagation(); const sub=b.dataset.delSub;
      if(!hideSubjectChoice(sub)) return;
      if((fs.value||'').trim()===sub){
        fs.value=allSubjects()[0]||'未分类'; ft.value='';
        it.data.subject=fs.value; it.data.topic='';
      }
      const w=b.closest('.taxchip'); if(w) w.remove();
      markSubjects(); paintTopics(); toast('科目选项已删除');
    });
    fs.onchange=()=>{ it.data.subject=fs.value; markSubjects(); paintTopics(); };
    ft.oninput=()=>{ it.data.topic=ft.value; paintTopics(); };
  }
  const kp = $(`[data-keep="${i}"]`); if(kp) kp.onclick = ()=>keepRes(i);
  const dp = $(`[data-drop="${i}"]`); if(dp) dp.onclick = async ()=>{
    await releaseAIItem(AIP.items[i]);
    AIP.items.splice(i,1); renderAI(); };
}

async function keepRes(i){
  const it = AIP.items[i], d = it.data;
  const pts = ptClean(Array.isArray(d.points) ? d.points : linesToPts(d.points));
  if(!(d.front||'').trim()) return toast('题干是空的');
  if(!pts.length) return toast('一条采分点都没有，先补一条');

  const c = blankCard();
  c.type = 'points';
  c.subject = (d.subject||'').trim() || allSubjects()[0] || '未分类';
  c.tags = (d.topic||'').trim() ? [(d.topic||'').trim()] : [];
  c.front = d.front || '';
  c.points = pts;
  c.hint = (d.hint||'').trim();
  c.image = '';                              // 原图只做识别，不跟着题目入库
  if(!d.answerVerified) c.aiUnverified = true;
  c.locationAt = Date.now();
  CAT.unhideSubject(c.subject);
  if(topicOf(c)) CAT.unhideTopic(c.subject,topicOf(c));
  LAST.set(c.subject, topicOf(c));
  await saveCard(c);
  await releaseAIItem(it);

  AIP.items.splice(i,1);
  renderAI();
  toast('存好了');
}

async function runAI(files){
  if(!files.length) return;
  for(let i=0;i<files.length;i++){
    renderAI({pct: Math.round(i/files.length*100), msg:`正在认第 ${i+1} 张，共 ${files.length} 张…`});
    let blob, url='';
    try{
      blob = await compress(files[i]);
      url  = URL.createObjectURL(blob);
      const data = await aiAnalyze(blob);
      AIP.items.push({data:data, url:url});
    }catch(e){
      if(url) URL.revokeObjectURL(url);
      AIP.items.push({err: e.message || String(e)});
    }
  }
  renderAI();
}

async function setupAutoUpdate(){
  if(!('serviceWorker' in navigator)) return;

  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(appSWReloading) return;
    appSWReloading = true;
    location.reload();
  });

  try{
    const reg = await navigator.serviceWorker.register('sw.js', {updateViaCache:'none'});
    appSWRegistration = reg;

    const activateWaiting = ()=>{
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
    };
    activateWaiting();

    reg.addEventListener('updatefound', ()=>{
      const worker = reg.installing;
      if(!worker) return;
      worker.addEventListener('statechange', ()=>{
        if(worker.state==='installed' && navigator.serviceWorker.controller)
          worker.postMessage({type:'SKIP_WAITING'});
      });
    });

    await reg.update();
    activateWaiting();
  }catch(e){}
}

async function forceAppUpdate(){
  if(!navigator.onLine) return toast('现在没有网络，联网后再检查');
  toast('正在检查更新…');

  try{
    const fresh = new URL('index.html', location.href);
    fresh.searchParams.set('_update', Date.now());
    const res = await fetch(fresh.toString(), {cache:'no-store'});
    if(!res.ok) throw new Error('network');

    const reg = appSWRegistration || await navigator.serviceWorker.getRegistration();
    if(reg){ try{ await reg.update(); }catch(e){} }
    toast('已获取最新版，正在重新打开…');
    setTimeout(()=>location.replace(fresh.toString()), 500);
  }catch(e){
    toast('检查失败，请确认网络后重试');
  }
}

  if(speechSynthesis.getVoices().length===0) speechSynthesis.onvoiceschanged = ()=>{};
  render();
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible'){ settleRank();
      if(S.tab==='today' && $('#review').classList.contains('hidden')) render(); }
  });
}
boot();
</script>
